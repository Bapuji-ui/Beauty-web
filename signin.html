
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow & Grace | Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #f9dce5, #fff5f7);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 35px 0;
        }

        .signup-container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(120, 40, 70, 0.15);
        }

        .signup-image {
            background:
                linear-gradient(rgba(60,20,35,.3),
                rgba(60,20,35,.3)),
                url("https://images.unsplash.com/photo-1560066984-138dadb4c035?w=1000")
                center/cover;

            min-height: 700px;
            color: white;
            display: flex;
            align-items: end;
            padding: 40px;
        }

        .signup-form {
            padding: 40px;
        }

        .brand {
            color: #bd496b;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
            color: #4a3038;
        }

        .form-control, .form-select {
            padding: 11px;
            border-radius: 8px;
        }

        .btn-signup {
            background: #bd496b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
        }

        .btn-signup:hover {
            background: #963550;
            color: white;
        }

        .links a {
            color: #bd496b;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media(max-width:768px) {
            .signup-image {
                min-height: 220px;
            }

            .signup-form {
                padding: 25px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="signup-container">

        <div class="row g-0">

            <!-- LEFT IMAGE SECTION -->
            <div class="col-md-5">

                <div class="signup-image">

                    <div>

                        <h2 class="fw-bold">
                            Join Glow & Grace
                        </h2>

                        <p>
                            Your beauty journey starts here.
                            Register with us and enjoy
                            professional beauty services.
                        </p>

                    </div>

                </div>

            </div>


            <!-- RIGHT SIGNUP SECTION -->
            <div class="col-md-7">

                <div class="signup-form">

                    <div class="text-center mb-4">

                        <h2 class="brand">
                            <i class="bi bi-flower1"></i>
                            Glow & Grace
                        </h2>

                        <h4>Create Your Account</h4>

                        <p class="text-muted">
                            Register to enjoy our beauty services
                        </p>

                    </div>


                    <!-- SIGNUP FORM -->
                    <form onsubmit="return validateForm()">

                        <div class="row g-3">

                            <!-- Full Name -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Enter your name"
                                       required>

                            </div>


                            <!-- Mobile -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Mobile Number
                                </label>

                                <input type="tel"
                                       class="form-control"
                                       placeholder="10-digit number"
                                       pattern="[0-9]{10}"
                                       maxlength="10"
                                       required>

                            </div>


                            <!-- Email -->
                            <div class="col-12">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>


                            <!-- Gender -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select class="form-select" required>

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option>Female</option>
                                    <option>Male</option>
                                    <option>Other</option>

                                </select>

                            </div>


                            <!-- DOB -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input type="date"
                                       class="form-control">

                            </div>


                            <!-- Address -->
                            <div class="col-12">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea class="form-control"
                                          rows="2"
                                          placeholder="Enter your address"></textarea>

                            </div>


                            <!-- Password -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       id="password"
                                       class="form-control"
                                       placeholder="Create password"
                                       minlength="8"
                                       required>

                            </div>


                            <!-- Confirm Password -->
                            <div class="col-md-6">

                                <label class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       id="confirmPassword"
                                       class="form-control"
                                       placeholder="Confirm password"
                                       required>

                            </div>

                        </div>


                        <!-- Terms -->
                        <div class="form-check mt-4">

                            <input type="checkbox"
                                   class="form-check-input"
                                   id="terms"
                                   required>

                            <label class="form-check-label"
                                   for="terms">

                                I agree to the Terms & Conditions

                            </label>

                        </div>


                        <!-- Button -->
                        <button type="submit"
                                class="btn btn-signup w-100 mt-4">

                            Create Account

                        </button>


                        <!-- Login Link -->
                        <p class="text-center mt-4">

                            Already have an account?

                            <span class="links">
                                <a href="Login.html">
                                    Login Here
                                </a>
                            </span>

                        </p>

                        <hr>

                        <p class="text-center text-muted small">
                            © 2026 Glow & Grace Beauty Parlour
                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- JavaScript Validation -->
<script>

    function validateForm() {

        let password =
            document.getElementById("password").value;

        let confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            alert("Password and Confirm Password do not match!");

            return false;

        }

        alert("Registration form validated successfully!");

        return false;

    }

</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
