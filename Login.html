
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow & Grace | Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #f9dce5, #fff5f7);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(120, 40, 70, 0.15);
        }

        .login-image {
            background:
                linear-gradient(rgba(60,20,35,.3),
                rgba(60,20,35,.3)),
                url("https://images.unsplash.com/photo-1560066984-138dadb4c035?w=1000")
                center/cover;
            min-height: 550px;
            color: white;
            display: flex;
            align-items: end;
            padding: 40px;
        }

        .login-form {
            padding: 50px 40px;
        }

        .brand {
            color: #bd496b;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-login {
            background: #bd496b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
        }

        .btn-login:hover {
            background: #963550;
            color: white;
        }

        .form-label {
            font-weight: 600;
        }

        .links a {
            color: #bd496b;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media(max-width:768px) {
            .login-image {
                min-height: 220px;
            }

            .login-form {
                padding: 30px 25px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="login-container">

        <div class="row g-0">

            <!-- LEFT IMAGE SECTION -->
            <div class="col-md-6">

                <div class="login-image">

                    <div>
                        <h2 class="fw-bold">
                            Welcome to Glow & Grace
                        </h2>

                        <p>
                            Beauty is not just about appearance.
                            It's about feeling confident and beautiful.
                        </p>
                    </div>

                </div>

            </div>


            <!-- RIGHT LOGIN SECTION -->
            <div class="col-md-6">

                <div class="login-form">

                    <div class="text-center mb-4">

                        <h2 class="brand">
                            <i class="bi bi-flower1"></i>
                            Glow & Grace
                        </h2>

                        <h4 class="mt-3">
                            Welcome Back!
                        </h4>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <!-- LOGIN FORM -->
                    <form action="#" method="post">

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input type="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Enter password"
                                       required>

                                <button class="btn btn-outline-secondary"
                                        type="button"
                                        onclick="togglePassword()">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </button>

                            </div>

                        </div>


                        <!-- Remember and Forgot -->
                        <div class="d-flex justify-content-between mb-4">

                            <div class="form-check">
                                <input type="checkbox"
                                       class="form-check-input"
                                       id="remember">

                                <label class="form-check-label"
                                       for="remember">
                                    Remember me
                                </label>
                            </div>

                            <div class="links">
                                <a href="forgot-password.html">
                                    Forgot Password?
                                </a>
                            </div>

                        </div>


                        <!-- Login Button -->
                        <button type="submit"
                                class="btn btn-login w-100">
                            Login
                        </button>


                        <!-- Register -->
                        <p class="text-center mt-4">

                            Don't have an account?

                            <span class="links">
                                <a href="signin.html">
                                    Create Account
                                </a>
                            </span>

                        </p>

                        <hr>

                        <p class="text-center text-muted small">
                            © 2026 Glow & Grace Beauty Parlour
                        </p>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Password Show / Hide -->
<script>

    function togglePassword() {

        let password = document.getElementById("password");

        let icon = document.getElementById("eyeIcon");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }

</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
